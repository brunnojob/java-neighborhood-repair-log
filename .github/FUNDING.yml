# These are supported funding model platforms

github: # Replace with up to 4 GitHub Sponsors-enabled usernames e.g., [user1, user2]
patreon: # Replace with a single Patreon username
open_collective: # Replace with a single Open Collective username
ko_fi: # Replace with a single Ko-fi username
tidelift: # Replace with a single Tidelift platform-name/package-name e.g., npm/babel
community_bridge: # Replace with a single Community Bridge project-name e.g., cloud-foundry
liberapay: # Replace with a single Liberapay username
issuehunt: # Replace with a single IssueHunt username
lfx_crowdfunding: # Replace with a single LFX Crowdfunding project-name e.g., cloud-foundry
polar: # Replace with a single Polar username
buy_me_a_coffee: # Replace with a single Buy Me a Coffee username
thanks_dev: # Replace with a single thanks.dev username
custom: # Replace with up to 4 custom sponsorship URLs e.g., ['link1', 'link2']
# Exibir botão de patrocinador no repositório

Você pode adicionar um botão de patrocinador em seu repositório para aumentar a visibilidade das opções de financiamento para seu projeto de open source.

## Sobre arquivos FUNDING

Configure o botão de patrocinador editando um arquivo `FUNDING.yml` na pasta `.github` do repositório, no branch padrão. É possível configurar o botão para incluir desenvolvedores patrocinados no GitHub Sponsors, em plataformas de financiamento externas ou em uma URL de financiamento personalizado. Para saber mais sobre GitHub Sponsors, confira [Sobre os Patrocinadores do GitHub](/pt/sponsors/getting-started-with-github-sponsors/about-github-sponsors).

Você pode adicionar um nome de usuário, de pacote ou de projeto por plataforma de financiamento externa e até quatro URLs personalizadas. Você pode adicionar uma organização e até quatro desenvolvedores patrocinados no GitHub Sponsors. Adicione cada plataforma em uma nova linha usando a sintaxe a seguir.

| Plataforma | Sintaxe |
| ---------- | ------- |

[LFX Mentorship (antigo CommunityBridge)](https://lfx.linuxfoundation.org/tools/mentorship) | `community_bridge: PROJECT-NAME`

[GitHub Sponsors](https://github.com/sponsors) |
`github: USERNAME` ou `github: [USERNAME, USERNAME, USERNAME, USERNAME]`

[IssueHunt](https://issuehunt.io/) | `issuehunt: USERNAME`

[Ko-fi](https://ko-fi.com/) | `ko_fi: USERNAME`

[Liberapay](https://en.liberapay.com/) | `liberapay: USERNAME`

[Open Collective](https://opencollective.com/) | `open_collective: USERNAME`

[Patreon](https://www.patreon.com/) | `patreon: USERNAME`

[Tidelift](https://tidelift.com/) | `tidelift: PLATFORM-NAME/PACKAGE-NAME`

[Polar](https://www.polar.sh/) | `polar: USERNAME`

[Compre-me um café](https://www.buymeacoffee.com/) | `buy_me_a_coffee: USERNAME`

[thanks.dev](https://thanks.dev/) | `thanks_dev: u/gh/USERNAME`
URL personalizada |
`custom: LINK1` ou `custom: [LINK1, LINK2, LINK3, LINK4]`

Para o Tidelift, use a sintaxe `platform-name/package-name` com os nomes de plataformas a seguir.

| Linguagem  | Nome da plataforma |
| ---------- | ------------------ |
| JavaScript | `npm`              |
| Python     | `pypi`             |
| Ruby       | `rubygems`         |
| Java       | `maven`            |
| PHP        | `packagist`        |
| C#         | `nuget`            |

Veja um arquivo `FUNDING.yml` de exemplo:

```yaml
github: [octocat, surftocat]
patreon: octocat
tidelift: npm/octo-package
custom: ["https://www.paypal.me/octocat", octocat.com]
```

> \[!NOTE]
> Se uma URL personalizada em uma matriz incluir `:`, você precisará colocar a URL entre aspas. Por exemplo, `"https://www.paypal.me/octocat"`.

Você pode criar um botão de patrocinador padrão para sua organização ou conta pessoal. Para saber mais, confira [Como criar um arquivo padrão de integridade da comunidade](/pt/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file).

> \[!NOTE]
> Os links de financiamento fornecem uma maneira de projetos de código aberto receberem apoio financeiro direto de sua comunidade. Não apoiamos o uso de links de financiamento para outros fins (como publicidade) ou grupos de apoio político, de caridade ou comunitários. Se tiver dúvidas sobre se o uso pretendido é compatível, visite a [Suporte do GitHub](https://support.github.com).

## Exibir botão de patrocinador no repositório

Qualquer pessoa com permissões de administrador pode habilitar um botão de patrocinador em um repositório.

1. Em GitHub, acesse a página principal do repositório.

