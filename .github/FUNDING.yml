5-.045.22-.313.411-.644.573-.99.014-.031.021-.11-.059-.19l-.815-.806c-.411-.406-.562-.957-.53-1.456a4.709 4.709 0 0 0 0-.582c-.032-.499.119-1.05.53-1.456l.815-.806c.081-.08.073-.159.059-.19a6.464 6.464 0 0 0-.573-.989c-.02-.03-.085-.076-.195-.046l-1.102.303c-.56.153-1.113.008-1.53-.27a4.44 4.44 0 0 0-.501-.29c-.447-.222-.85-.629-.997-1.189l-.289-1.105c-.029-.11-.101-.143-.137-.146a6.6 6.6 0 0 0-1.142 0ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9.5 8a1.5 1.5 0 1 0-3.001.001A1.5 1.5 0 0 0 9.5 8Z"></path></svg> Settings**. Caso não consiga ver a guia "Configurações", selecione o menu suspenso **<svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-kebab-horizontal" aria-label="More" role="img"><path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg>** , clique em **Configurações**.

   ![Captura de tela de um cabeçalho de repositório que mostra as guias. A guia "Configurações" é realçada por um contorno laranja-escuro.](/assets/images/help/repository/repo-actions-settings.png)

3. Na página de configurações "Geral", na seção "Recursos", selecione **Patrocínios**.

4. Na caixa "Patrocínios", clique em **Configurar o botão de patrocinador** ou **Sobrescrever links de financiamento**.

5. No editor de arquivos, siga as instruções descritas no arquivo `FUNDING.yml` para adicionar links aos locais de financiamento.

6. Clique em **Fazer commit das alterações...**

7. No campo "Mensagem do commit", digite uma mensagem curta e relevante que descreva a alteração que você fez no arquivo. Você pode atribuir o commit a mais de um autor na mensagem do commit. Para saber mais, confira [Criar um commit com vários autores ou em nome de uma organização](/pt/pull-requests/how-tos/commit-changes/creating-a-commit-with-multiple-authors).

8. Abaixo dos campos da mensagem de commit, decida se deseja adicionar seu commit ao ramo atual ou a um novo ramo. Se seu branch atual for o branch-padrão, você deverá optar por criar um novo branch para seu commit e, em seguida, criar um pull request. Para saber mais, confira [Como criar uma solicitação de pull](/pt/pull-requests/how-tos/create-pull-requests/creating-a-pull-request).

   ![Captura de tela de um pull request do GitHub mostrando um botão de opção para fazer commit diretamente na branch principal ou criar uma nova branch. A nova ramificação está selecionada.](/assets/images/help/repository/choose-commit-branch.png)

9. Clique em **Fazer commit de alterações** ou em **Propor alterações**.

